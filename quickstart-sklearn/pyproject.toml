[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quickstart-sklearn"
version = "1.0.1"
description = "Federated Learning with scikit-learn and Flower (Quickstart Example)"
license = "Apache-2.0"
dependencies = [
    "flwr[simulation]>=1.26.0",
    "pandas>=2.0",
    "xgboost>=2.0",
    "scikit-learn>=1.6.1",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.flwr.app]
publisher = "flwrlabs"

[tool.flwr.app.components]
serverapp = "sklearnexample.server_app:app"
clientapp = "sklearnexample.client_app:app"

[tool.flwr.app.config]
penalty = "l2"
num-server-rounds = 25
min-available-clients = 3
data-path = "../creditcard.csv"
# Which homogeneous FL experiment to run: "logreg", "mlp", "xgboost" or "rf"
model = "logreg"
local-epochs = 1
rf-trees-per-bank = 200
