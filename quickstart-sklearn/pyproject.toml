[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quickstart-sklearn"
version = "1.0.1"
description = "Federated Learning with scikit-learn and Flower (Quickstart Example)"
license = "Apache-2.0"
dependencies = [
    "flwr[simulation]>=1.26.0",
    "pandas>=2.0",
    "xgboost>=2.0",
    "scikit-learn>=1.6.1",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.flwr.app]
publisher = "flwrlabs"

[tool.flwr.app.components]
serverapp = "sklearnexample.server_app:app"
clientapp = "sklearnexample.client_app:app"

[tool.flwr.app.config]
penalty = "l2"
# Every experiment runs this many rounds; the reported round is the one with
# the best validation PR-AUC
num-server-rounds = 100
min-available-clients = 3
data-path = "../creditcard.csv"
# Which experiment to run: "logreg", "mlp", "xgboost", "rf" (homogeneous FL)
# or "committee" (heterogeneous committee)
model = "logreg"
local-epochs = 1
# Random Forest: new trees each bank adds per round (100 rounds x 2 = 200 per bank)
rf-trees-per-round = 2
# Experiment 4: model type per bank (bank 0, 1, 2) and distillation strength
committee-models = "xgboost,rf,mlp"
kd-alpha = 0.5
