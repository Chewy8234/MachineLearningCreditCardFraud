# Interactive helper pod (no controller) used ONLY to copy files to/from the volume with `kubectl cp`.
# NRP allows `sleep` in interactive pods (auto-destroyed after 6 h); it is forbidden inside Jobs.
# 1 CPU / 2 GB is exempt from NRP's utilisation checks. Delete it as soon as you're done.
apiVersion: v1
kind: Pod
metadata:
  name: heterofl-loader
  namespace: fgcu-vinodahuja-aml
spec:
  restartPolicy: Never
  containers:
    - name: shell
      image: busybox:1.36
      command: ["sleep", "7200"]
      resources:
        requests: {cpu: "1", memory: 2Gi}
        limits: {cpu: "1", memory: 2Gi}
      volumeMounts:
        - {name: store, mountPath: /store}
  volumes:
    - name: store
      persistentVolumeClaim: {claimName: heterofl-data}
