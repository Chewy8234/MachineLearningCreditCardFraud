# Bank->model assignment permutation RMX (banks A,B,C). The paper assigns XRM. Separates model-family
# effects from data-size effects under Dirichlet quantity skew. FedAvg/centralized do not depend on assignment.
base_config: val_base.yaml
profile: validation_perm_RMX
results_dir: results/val_perm_RMX
methods: [local, ensemble, heterogeneous_kd]
clients:
  - {bank: A, model: random_forest}
  - {bank: B, model: mlp}
  - {bank: C, model: xgboost}
